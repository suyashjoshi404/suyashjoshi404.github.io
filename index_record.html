<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Taste · Suyash Joshi</title>
    <style>
      :root {
        --page: #e7e7e7;
        --ink: #2f2f2f;
        --accent: #49a1b9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.72), transparent 34rem),
          var(--page);
        color: var(--ink);
        font-family:
          Inter, Avenir, "Helvetica Neue", Arial, sans-serif;
      }

      .back-link {
        position: fixed;
        top: 1.25rem;
        left: 1.25rem;
        color: #555;
        font-size: 0.92rem;
        text-decoration: none;
      }

      .back-link:hover {
        color: #111;
        text-decoration: underline;
      }

      .stage {
        width: min(92vw, 42rem);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 3.5rem 1rem 2rem;
      }

      .deck {
        width: 100%;
        display: grid;
        justify-items: center;
        gap: 1.5rem;
      }

      .player {
        width: min(74vw, 28rem);
        aspect-ratio: 1;
        border-radius: 50%;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 1.25rem 1.45rem rgba(43, 43, 43, 0.16));
      }

      .record {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        animation: spin 5s linear infinite;
      }

      .record img {
        width: var(--image-size, 100%);
        height: var(--image-size, 100%);
        display: block;
        object-fit: contain;
        object-position: center;
        border-radius: 50%;
        transform: translate(var(--image-x, 0), var(--image-y, 0));
      }

      .records {
        width: min(100%, 46rem);
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 8rem));
        gap: 0.85rem;
        justify-content: center;
      }

      .album-card {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        padding: 0;
        text-align: center;
      }

      .cover {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        border: 0.12rem solid rgba(255, 255, 255, 0.84);
        background: #111;
        box-shadow: 0 0.52rem 1.05rem rgba(43, 43, 43, 0.14);
        overflow: hidden;
      }

      .cover img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .album-card[aria-pressed="true"] .cover {
        border-color: var(--accent);
        box-shadow:
          0 0 0 0.12rem rgba(73, 161, 185, 0.35),
          0 0.7rem 1.25rem rgba(43, 43, 43, 0.18);
      }

      .album-name {
        display: block;
        margin-top: 0.58rem;
        color: #575757;
        font-size: 0.86rem;
        line-height: 1.2;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (max-width: 34rem) {
        .player {
          width: min(86vw, 23.5rem);
        }

        .records {
          grid-template-columns: repeat(2, minmax(0, 7.25rem));
          gap: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="index.html">Home</a>

    <main class="stage" aria-label="Portfolio vinyl player">
      <div class="deck">
        <section class="player" aria-label="Selected rotating vinyl record">
          <div class="record">
            <img data-disc src="img/ninajirachi_vinyl.png" alt="NinaJirachi blue and white vinyl record playing" />
          </div>
        </section>

        <div class="records" aria-label="Record selection">
          <button class="album-card" type="button" aria-pressed="true" data-record="0">
            <span class="cover">
              <img src="img/ninajirachi_cover.jpg" alt="NinaJirachi album cover" />
            </span>
            <span class="album-name">Ninajirachi</span>
          </button>

          <button class="album-card" type="button" aria-pressed="false" data-record="1">
            <span class="cover">
              <img src="img/mfdoom_cover.jpg" alt="MF DOOM album cover" />
            </span>
            <span class="album-name">MF DOOM</span>
          </button>

          <button class="album-card" type="button" aria-pressed="false" data-record="2">
            <span class="cover">
              <img src="img/nujabes_cover.jpg" alt="Nujabes album cover" />
            </span>
            <span class="album-name">Nujabes</span>
          </button>

          <button class="album-card" type="button" aria-pressed="false" data-record="3">
            <span class="cover">
              <img src="img/fuel_cover.jpg" alt="Fuel album cover" />
            </span>
            <span class="album-name">Fuel</span>
          </button>

          <button class="album-card" type="button" aria-pressed="false" data-record="4">
            <span class="cover">
              <img src="img/egypt_central.jpg" alt="Egypt Central album cover" />
            </span>
            <span class="album-name">Egypt Central</span>
          </button>
        </div>
      </div>
    </main>

    <script>
      const records = [
        {
          disc: "img/ninajirachi_vinyl.png",
          alt: "Ninajirachi blue and white vinyl record playing",
          size: "100%",
          x: "0",
          y: "0",
          audio: "audio/ItsYou.mp3",
        },
        {
          disc: "img/mfdoom_record.webp",
          alt: "MF DOOM purple vinyl record playing",
          size: "100%",
          x: "0",
          y: "0",
          audio: "audio/Doomsday.mp3",
        },
        {
          disc: "img/nujabes_record.png",
          alt: "Nujabes gold vinyl record playing",
          size: "100%",
          x: "0",
          y: "0",
          audio: "audio/BlessingIt.mp3",
        },
        {
          disc: "img/fuel_record.webp",
          alt: "Fuel red vinyl record playing",
          size: "100%",
          x: "0",
          y: "0",
          audio: "audio/Hemorrhage.mp3",
        },
        {
          disc: "img/generic_vinyl.png",
          alt: "Egypt Central vinyl record playing",
          size: "100%",
          x: "0",
          y: "0",
          audio: "audio/YouMakeMeSick.mp3",
        },
      ];

      const disc = document.querySelector("[data-disc]");
      const discWrap = document.querySelector(".record");
      const cards = Array.from(document.querySelectorAll("[data-record]"));
      const maxVolume = 0.72;
      const audioPlayers = new Map();
      const fadeFrames = new Map();
      let activeAudio = null;
      let activeAudioSrc = null;
      let activeRecord = 0;

      records.forEach((record) => {
        if (!record.audio || audioPlayers.has(record.audio)) {
          return;
        }

        const audio = new Audio(record.audio);
        audio.preload = "auto";
        audio.volume = 0;
        audioPlayers.set(record.audio, audio);
      });

      function fadeAudio(audio, targetVolume, duration = 1800) {
        const pendingFrame = fadeFrames.get(audio);

        if (pendingFrame) {
          cancelAnimationFrame(pendingFrame);
        }

        const startVolume = audio.volume;
        const startedAt = performance.now();

        function tick(now) {
          const progress = Math.min((now - startedAt) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);

          audio.volume = startVolume + (targetVolume - startVolume) * eased;

          if (progress < 1) {
            fadeFrames.set(audio, requestAnimationFrame(tick));
            return;
          }

          audio.volume = targetVolume;
          fadeFrames.delete(audio);

          if (targetVolume === 0) {
            audio.pause();
          }
        }

        fadeFrames.set(audio, requestAnimationFrame(tick));
      }

      function playAudio(src) {
        const audio = audioPlayers.get(src);

        if (!audio) {
          stopActiveAudio();
          return;
        }

        if (activeAudio && activeAudio !== audio) {
          fadeAudio(activeAudio, 0, 1100);
        }

        if (audio.paused || audio.ended) {
          audio.currentTime = 0;
          audio.volume = 0;
        }

        audio.play().then(() => {
          fadeAudio(audio, maxVolume);
          activeAudio = audio;
          activeAudioSrc = src;
        }).catch(() => {
          audio.pause();
        });
      }

      function stopActiveAudio() {
        if (activeAudio && !activeAudio.paused) {
          fadeAudio(activeAudio, 0, 1100);
        }

        activeAudio = null;
        activeAudioSrc = null;
      }

      function selectRecord(index, shouldPlay = false) {
        const record = records[index];

        disc.src = record.disc;
        disc.alt = record.alt;
        discWrap.style.setProperty("--image-size", record.size);
        discWrap.style.setProperty("--image-x", record.x);
        discWrap.style.setProperty("--image-y", record.y);

        cards.forEach((card, cardIndex) => {
          card.setAttribute("aria-pressed", String(cardIndex === index));
        });

        if (shouldPlay && record.audio && activeAudioSrc === record.audio && activeRecord === index) {
          stopActiveAudio();
        } else if (shouldPlay && record.audio) {
          playAudio(record.audio);
        } else if (activeRecord !== index) {
          stopActiveAudio();
        }

        activeRecord = index;
      }

      cards.forEach((card) => {
        card.addEventListener("click", () => {
          selectRecord(Number(card.dataset.record), true);
        });
      });

      selectRecord(0);
    </script>
  </body>
</html>
