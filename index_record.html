<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Listening Room · Suyash Joshi</title>
  <style>
    :root{color-scheme:light;--page:#f7f7f5;--ink:#111;--muted:rgba(17,17,17,.42);--line:rgba(17,17,17,.14);--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%}
    body{margin:0;overflow:hidden;background:var(--page);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,a{color:inherit;font:inherit}button{border:0}.site-header{position:fixed;z-index:20;top:0;left:0;width:100%;height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 32px}
    .home-link,.edition{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}.home-link{justify-self:start;transition:color 180ms}.home-link:hover,.home-link:focus-visible{color:var(--ink)}
    .edition{grid-column:3;justify-self:end}
    .listening-room{position:fixed;inset:76px 0 164px;display:flex;align-items:center;justify-content:center}.player-stack{display:flex;flex-direction:column;align-items:center;gap:20px}
    .album-object{position:relative;width:301px;height:301px;isolation:isolate}.vinyl-wrap{position:absolute;z-index:1;top:3.25%;left:22%;width:93.5%;aspect-ratio:1;filter:drop-shadow(12px 7px 12px rgba(17,17,17,.14));transition:transform 800ms var(--ease),opacity 260ms}
    .vinyl-wrap.is-changing{opacity:0;transform:translateX(-8px) scale(.97)}.vinyl{display:block;width:100%;height:100%;object-fit:contain;animation:spin 7s linear infinite;animation-play-state:paused}body.is-playing .vinyl{animation-play-state:running}
    .cover-wrap{position:absolute;z-index:2;inset:0;overflow:hidden;border-radius:16px;outline:.5px solid rgba(17,17,17,.28);background:#ddd;box-shadow:0 11px 30px rgba(17,17,17,.08);transition:transform 600ms var(--ease),opacity 260ms}
    .cover-wrap:after{position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.18);border-radius:inherit;box-shadow:inset 0 0 24px rgba(255,255,255,.06);content:"";pointer-events:none}.cover-wrap.is-changing{opacity:0;transform:translateY(9px) scale(.975)}
    .cover-art{display:block;width:100%;height:100%;object-fit:cover}.now-playing{display:flex;min-width:190px;flex-direction:column;align-items:center;gap:14px}.track-copy{display:grid;justify-items:center;gap:2px;transition:transform 300ms var(--ease),opacity 180ms}.track-copy.is-changing{opacity:0;transform:translateY(4px)}
    .artist-name{color:var(--muted);font-size:13px;line-height:16px}.song-name{max-width:280px;overflow:hidden;font-size:14px;font-weight:600;line-height:20px;text-align:center;text-overflow:ellipsis;white-space:nowrap}
    .controls{display:flex;align-items:center;gap:4px;padding:3px 13px;border:1px solid rgba(17,17,17,.12);border-radius:999px;background:linear-gradient(#fff,#e8e7e5);box-shadow:0 1px 2px rgba(17,17,17,.04)}.control{width:24px;height:24px;display:grid;place-items:center;padding:0;background:transparent;cursor:pointer;opacity:.28;transition:opacity 150ms,transform 150ms}.control:hover,.control:focus-visible{opacity:.75}.control:active{transform:scale(.88)}.control svg{width:16px;height:16px;fill:currentColor}.play-toggle{opacity:.65}.pause-icon{display:none}body.is-playing .play-icon{display:none}body.is-playing .pause-icon{display:block}
    .dock-wrap{position:fixed;z-index:30;right:0;bottom:51px;left:0;display:flex;justify-content:center;pointer-events:none}.dock{display:flex;align-items:flex-end;justify-content:safe center;max-width:100%;margin:0;padding:64px 10px 6px;overflow-x:auto;list-style:none;scrollbar-width:none;pointer-events:auto}.dock::-webkit-scrollbar{display:none}
    .dock-item{position:relative;width:80px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:width 500ms var(--ease)}.dock-item:has(+ .dock-item:hover),.dock-item:hover+.dock-item{width:112px}.dock-item:hover{width:130px}.album-button{width:100%;padding:0 8px;background:transparent;cursor:pointer}
    .thumb-frame{position:relative;display:block;width:100%;aspect-ratio:1;overflow:hidden;border-radius:8px;outline:.5px solid rgba(17,17,17,.18);background:#ddd;transition:box-shadow 200ms,transform 120ms}.album-button:active .thumb-frame{transform:scale(1.05)}.album-button[aria-pressed="true"] .thumb-frame{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--ink)}.thumb-frame:after{position:absolute;inset:0;border:1px solid rgba(255,255,255,.16);border-radius:inherit;content:""}.thumb-frame img{display:block;width:100%;height:100%;object-fit:cover}
    .tooltip{position:absolute;z-index:-1;top:0;left:50%;padding:5px 7px;border-radius:4px;background:#111;color:#fff;font-size:12px;line-height:1;opacity:0;pointer-events:none;transform:translate(-50%,-70%);transition:opacity 300ms var(--ease),transform 500ms var(--ease);white-space:nowrap}.dock-item:hover .tooltip,.album-button:focus-visible+.tooltip{z-index:1;opacity:1;transform:translate(-50%,-145%)}
    .timeline{position:fixed;right:0;bottom:0;left:0;height:51px;display:grid;place-items:center;padding:0 16px;color:rgba(17,17,17,.34);font-size:12px;font-weight:600}.timeline-message{font-size:11px;letter-spacing:.02em;text-transform:lowercase}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes spin{to{transform:rotate(1turn)}}
    @media(max-width:700px){.site-header{height:68px;padding:0 18px}.edition{display:none}.listening-room{inset:68px 0 150px}.player-stack{gap:16px}.album-object{width:201px;height:201px}.dock-wrap{bottom:47px;justify-content:flex-start}.dock{width:100%;justify-content:flex-start;padding:48px 14px 6px}.dock-item,.dock-item:has(+ .dock-item:hover),.dock-item:hover+.dock-item,.dock-item:hover{width:19vw;min-width:70px}.tooltip{display:none}.timeline{height:47px}.timeline-message{font-size:10px}}
    @media(max-height:690px) and (min-width:701px){.album-object{width:245px;height:245px}.player-stack{gap:12px}.listening-room{bottom:142px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="index.html" aria-label="Back to portfolio">← Home</a>
    <div class="edition">Listening room · 01</div>
  </header>

  <main class="listening-room">
    <div class="player-stack">
      <section class="album-object" aria-label="Selected record">
        <div class="vinyl-wrap"><img class="vinyl" data-vinyl src="img/ninajirachi_vinyl.png" alt=""></div>
        <div class="cover-wrap"><img class="cover-art" data-cover src="img/ninajirachi_cover.jpg" alt="Ninajirachi album cover"></div>
      </section>
      <section class="now-playing" aria-label="Audio player">
        <div class="track-copy" aria-live="polite"><span class="artist-name" data-artist>Ninajirachi</span><span class="song-name" data-title>It’s You</span></div>
        <div class="controls">
          <button class="control" type="button" data-previous aria-label="Previous record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6V6Zm3 6 9-6v12l-9-6Z"/></svg></button>
          <button class="control play-toggle" type="button" data-play aria-label="Play It’s You"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg></button>
          <button class="control" type="button" data-next aria-label="Next record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2V6ZM6 6l9 6-9 6V6Z"/></svg></button>
        </div>
      </section>
    </div>
  </main>

  <nav class="dock-wrap" aria-label="Record collection"><ul class="dock">
    <li class="dock-item"><button class="album-button" type="button" data-record="0" aria-pressed="true"><span class="thumb-frame"><img src="img/ninajirachi_cover.jpg" alt=""></span><span class="sr-only">Play Ninajirachi — It’s You</span></button><span class="tooltip">It’s You</span></li>
    <li class="dock-item"><button class="album-button" type="button" data-record="1" aria-pressed="false"><span class="thumb-frame"><img src="img/mfdoom_cover.jpg" alt=""></span><span class="sr-only">Play MF DOOM — Doomsday</span></button><span class="tooltip">Doomsday</span></li>
    <li class="dock-item"><button class="album-button" type="button" data-record="2" aria-pressed="false"><span class="thumb-frame"><img src="img/nujabes_cover.jpg" alt=""></span><span class="sr-only">Play Nujabes — Blessing It</span></button><span class="tooltip">Blessing It</span></li>
    <li class="dock-item"><button class="album-button" type="button" data-record="3" aria-pressed="false"><span class="thumb-frame"><img src="img/fuel_cover.jpg" alt=""></span><span class="sr-only">Play Fuel — Hemorrhage</span></button><span class="tooltip">Hemorrhage</span></li>
    <li class="dock-item"><button class="album-button" type="button" data-record="4" aria-pressed="false"><span class="thumb-frame"><img src="img/egypt_central.jpg" alt=""></span><span class="sr-only">Play Egypt Central — You Make Me Sick</span></button><span class="tooltip">You Make Me Sick</span></li>
  </ul></nav>

  <footer class="timeline" aria-hidden="true"><span class="timeline-message">‹‹ select a record ››</span></footer>

  <script>
    const records=[
      {artist:"Ninajirachi",title:"It’s You",cover:"img/ninajirachi_cover.jpg",vinyl:"img/ninajirachi_vinyl.png",audio:"audio/ItsYou.mp3"},
      {artist:"MF DOOM",title:"Doomsday",cover:"img/mfdoom_cover.jpg",vinyl:"img/mfdoom_record.png",audio:"audio/Doomsday.mp3"},
      {artist:"Nujabes",title:"Blessing It",cover:"img/nujabes_cover.jpg",vinyl:"img/nujabes_record.png",audio:"audio/BlessingIt.mp3"},
      {artist:"Fuel",title:"Hemorrhage (In My Hands)",cover:"img/fuel_cover.jpg",vinyl:"img/fuel_record.webp",audio:"audio/Hemorrhage.mp3"},
      {artist:"Egypt Central",title:"You Make Me Sick",cover:"img/egypt_central.jpg",vinyl:"img/egypt_central_vinyl.png",audio:"audio/YouMakeMeSick.mp3"}
    ];
    const body=document.body,cover=document.querySelector("[data-cover]"),coverWrap=document.querySelector(".cover-wrap"),vinyl=document.querySelector("[data-vinyl]"),vinylWrap=document.querySelector(".vinyl-wrap"),trackCopy=document.querySelector(".track-copy"),artist=document.querySelector("[data-artist]"),title=document.querySelector("[data-title]"),playButton=document.querySelector("[data-play]"),recordButtons=[...document.querySelectorAll("[data-record]")];
    const players=records.map(record=>{const player=new Audio(record.audio);player.preload="metadata";player.addEventListener("ended",()=>setPlaying(false));return player});
    let activeIndex=0,transitionTimer;
    function setPlaying(playing){body.classList.toggle("is-playing",playing);playButton.setAttribute("aria-label",`${playing?"Pause":"Play"} ${records[activeIndex].title}`)}
    function stopAll(exceptIndex=-1){players.forEach((player,index)=>{if(index!==exceptIndex){player.pause();player.currentTime=0}})}
    function toggleAudio(){const player=players[activeIndex];if(!player.paused){player.pause();setPlaying(false);return}stopAll(activeIndex);player.volume=.72;player.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false))}
    function renderRecord(index,autoplay=false){const record=records[index];clearTimeout(transitionTimer);coverWrap.classList.add("is-changing");vinylWrap.classList.add("is-changing");trackCopy.classList.add("is-changing");stopAll();setPlaying(false);activeIndex=index;recordButtons.forEach((button,i)=>button.setAttribute("aria-pressed",String(i===index)));
      transitionTimer=window.setTimeout(()=>{cover.src=record.cover;cover.alt=`${record.artist} album cover`;vinyl.src=record.vinyl;artist.textContent=record.artist;title.textContent=record.title;playButton.setAttribute("aria-label",`Play ${record.title}`);requestAnimationFrame(()=>{coverWrap.classList.remove("is-changing");vinylWrap.classList.remove("is-changing");trackCopy.classList.remove("is-changing")});if(autoplay)toggleAudio()},230)}
    recordButtons.forEach(button=>button.addEventListener("click",()=>{const index=Number(button.dataset.record);index===activeIndex?toggleAudio():renderRecord(index,true)}));
    playButton.addEventListener("click",toggleAudio);document.querySelector("[data-previous]").addEventListener("click",()=>renderRecord((activeIndex-1+records.length)%records.length,true));document.querySelector("[data-next]").addEventListener("click",()=>renderRecord((activeIndex+1)%records.length,true));
    document.addEventListener("keydown",event=>{if(event.code==="Space"&&!event.target.closest("button, a")){event.preventDefault();toggleAudio()}if(event.key==="ArrowLeft")renderRecord((activeIndex-1+records.length)%records.length,false);if(event.key==="ArrowRight")renderRecord((activeIndex+1)%records.length,false)});
  </script>
</body>
</html>
